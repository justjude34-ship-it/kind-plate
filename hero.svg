<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Weet-Bix, toast and fruit in morning light">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141821"/>
      <stop offset="1" stop-color="#07080c"/>
    </linearGradient>
    <radialGradient id="window" cx="18%" cy="12%" r="62%">
      <stop offset="0" stop-color="#f4e3b8" stop-opacity=".42"/>
      <stop offset="0.4" stop-color="#d4b46a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#07080c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="88%" cy="8%" r="40%">
      <stop offset="0" stop-color="#7ec8c0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#07080c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f1e6"/>
      <stop offset="1" stop-color="#d9cbb3"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d48a"/>
      <stop offset="1" stop-color="#b8893a"/>
    </linearGradient>
    <linearGradient id="toast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c07a"/>
      <stop offset="1" stop-color="#b57a38"/>
    </linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="1" stop-color="#e6d7bd"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#window)"/>
  <rect width="1600" height="900" fill="url(#tealGlow)"/>
  <ellipse cx="800" cy="760" rx="520" ry="70" fill="#000" opacity=".28" filter="url(#soft)"/>
  <ellipse cx="800" cy="560" rx="430" ry="250" fill="url(#goldRim)"/>
  <ellipse cx="800" cy="560" rx="406" ry="232" fill="url(#plate)"/>
  <ellipse cx="800" cy="568" rx="300" ry="150" fill="#cbb89a" opacity=".35"/>
  <ellipse cx="690" cy="560" rx="168" ry="108" fill="#c4b197"/>
  <ellipse cx="690" cy="560" rx="150" ry="94" fill="url(#milk)"/>
  <g transform="translate(610 508)">
    <rect x="0" y="0" width="118" height="26" rx="5" fill="#c9a36a"/>
    <rect x="6" y="4" width="106" height="7" rx="2" fill="#a97d42" opacity=".45"/>
    <rect x="18" y="20" width="118" height="26" rx="5" fill="#d4b07a"/>
    <rect x="24" y="24" width="106" height="7" rx="2" fill="#b88948" opacity=".4"/>
    <rect x="6" y="42" width="118" height="26" rx="5" fill="#c29a5e"/>
  </g>
  <circle cx="640" cy="548" r="11" fill="#8b2e3a"/>
  <circle cx="668" cy="536" r="9" fill="#6d1f2c"/>
  <circle cx="704" cy="552" r="10" fill="#a33b48"/>
  <circle cx="730" cy="534" r="8" fill="#7a2432"/>
  <g transform="translate(860 500) rotate(-12)">
    <rect width="150" height="96" rx="10" fill="url(#toast)"/>
    <rect x="10" y="10" width="130" height="76" rx="6" fill="#f0d7a0" opacity=".35"/>
    <path d="M18 28h114M18 48h114M18 68h90" stroke="#a36b32" stroke-width="3" opacity=".25"/>
  </g>
  <g transform="translate(980 430)">
    <ellipse cx="48" cy="78" rx="40" ry="14" fill="#000" opacity=".2"/>
    <path d="M18 70c0-28 14-54 30-54s30 26 30 54v8H18z" fill="#e8d7b8"/>
    <path d="M26 70c0-22 10-42 22-42s22 20 22 42" fill="none" stroke="#c9b08a" stroke-width="3"/>
    <ellipse cx="48" cy="28" rx="16" ry="7" fill="#d4b46a"/>
    <path d="M44 8c6 8 4 16 0 22" fill="none" stroke="#f4efe6" stroke-width="3" opacity=".45"/>
    <path d="M54 10c5 7 4 14 1 20" fill="none" stroke="#f4efe6" stroke-width="2.4" opacity=".28"/>
  </g>
  <text x="96" y="120" fill="#7ec8c0" font-family="Georgia, serif" font-size="22" letter-spacing="6">DAILY PLATE</text>
  <text x="96" y="168" fill="#f4efe6" font-family="Georgia, serif" font-size="44">Morning light.</text>
